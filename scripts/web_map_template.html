<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PAGE_TITLE__</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1f2328; --muted: #5f6670; --line: #e3e3df;
    --current: #b0005f; --current-fill: #e6007e; --former: #e69f00; --accent-bg: #fdeef6;
    --seg-bg: #efefec; --seg-on: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171a; --panel: #1d2024; --text: #e8e9eb; --muted: #9aa1aa; --line: #30343a;
      --accent-bg: #3a1a2b; --seg-bg: #2a2e33; --seg-on: #3a3f46;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171a; --panel: #1d2024; --text: #e8e9eb; --muted: #9aa1aa; --line: #30343a;
    --accent-bg: #3a1a2b; --seg-bg: #2a2e33; --seg-on: #3a3f46;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { display: grid; grid-template-columns: 370px minmax(0, 1fr); height: 100vh;
         transition: grid-template-columns 0.25s ease; }
  .app.collapsed { grid-template-columns: 0px minmax(0, 1fr); }
  .app.wide:not(.collapsed) { grid-template-columns: 50vw minmax(0, 1fr); }   /* Counties tab */
  .county-wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .app.wide .county-wrap { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }
  .county-map { position: relative; }
  .county-tip { position: fixed; z-index: 10; pointer-events: none; background: #fff; color: #1f2328;
                border-radius: 6px; padding: 6px 9px; font-size: 13px; line-height: 1.4;
                box-shadow: 0 2px 8px rgba(0,0,0,.25); white-space: nowrap; }
  .county-tip[hidden] { display: none; }
  .app.collapsed aside { visibility: hidden; padding-left: 0; padding-right: 0; border: 0; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto;
          padding: 20px 20px 28px; }
  .map-wrap { position: relative; height: 100%; min-height: 0; }
  .panel-toggle { position: absolute; top: 10px; left: 10px; z-index: 3; display: flex; align-items: center;
                  gap: 6px; padding: 7px 12px 7px 9px; border: 0; border-radius: 8px; background: #fff;
                  color: #1f2328; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
                  box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .panel-toggle:hover { background: #f1f1ee; }
  .panel-toggle svg { transition: transform 0.25s ease; }
  .app.collapsed .panel-toggle svg { transform: rotate(180deg); }
  #map { position: absolute; inset: 0; background: #f7f7f5; }
  h1 { font-size: 20px; margin: 0 0 18px; letter-spacing: -0.01em; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
       margin: 22px 0 8px; font-weight: 600; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .tile b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .tile span { color: var(--muted); font-size: 12px; }
  .tile.hl { background: var(--accent-bg); border-color: transparent; }
  .note { color: var(--muted); font-size: 12.5px; margin: 10px 0 0; }
  .seg { display: flex; background: var(--seg-bg); border-radius: 8px; padding: 3px; gap: 3px;
         margin-bottom: 8px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--text); padding: 6px 4px;
                border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--seg-on); box-shadow: 0 1px 2px rgba(0,0,0,.15);
                                      font-weight: 600; }
  .seg-label { font-size: 12px; color: var(--muted); margin: 0 0 4px; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 0 0 14px; }
  .tabs button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; font-weight: 600;
                 padding: 8px 12px 9px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--current-fill); }
  .county-map svg { display: block; width: 100%; height: auto; }
  .county-map path { stroke: #ffffff; stroke-width: 0.8; stroke-linejoin: round; }
  .county-map path { cursor: default; }
  h2.map-title { font-size: 16px; font-weight: 700; margin-top: 26px; }
  .county-map path.hl { stroke: #1f2328; stroke-width: 2.2; }
  .county-map svg { overflow: visible; }
  .key { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
  .key i { display: inline-block; width: 14px; height: 11px; margin-right: 5px; vertical-align: -1px; border-radius: 2px; }
  #tbl-county tbody tr { cursor: default; }
  #tbl-county tbody tr.hl td { background: var(--accent-bg); }
  #tbl-county tfoot td { font-weight: 600; border-top: 1px solid var(--muted); border-bottom: 0; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; margin: 4px 0 10px;
           cursor: pointer; }
  .check input { margin-top: 3px; accent-color: var(--current); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 4px 0 4px 8px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  th { color: var(--muted); font-weight: 500; vertical-align: bottom; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px;
            vertical-align: -1px; }
  details { margin-top: 22px; font-size: 12.5px; color: var(--muted); }
  details summary { cursor: pointer; color: var(--text); font-weight: 600; }
  details p { margin: 6px 0; }
  /* map overlays always sit on the light USGS topo map, so they use fixed light colors */
  .legend { position: absolute; right: 10px; bottom: 28px; z-index: 2; background: #fff; color: #1f2328;
            padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.55;
            box-shadow: 0 1px 4px rgba(0,0,0,.25); max-width: 240px; }
  .legend i { display: inline-block; width: 14px; height: 12px; margin-right: 6px; vertical-align: -1px; }
  .legend svg { display: block; margin: 4px 0; }
  .legend small { color: #5f6670; display: block; line-height: 1.35; margin-top: 4px; }
  .area-label { color: #1f2328; font-size: 11px; line-height: 1.2; text-align: center; white-space: nowrap;
               text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; pointer-events: none; }
  .area-label b { font-size: 13px; }
  .maplibregl-popup-content { font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                              color: #1f2328; padding: 10px 12px; }
  @media (max-width: 820px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 62vh auto; height: auto; }
    .map-wrap { grid-row: 1; height: 62vh; }
    .app.collapsed { grid-template-columns: minmax(0, 1fr); }
    .app.collapsed aside { display: none; }
    aside { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); padding: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside id="panel">
    <h1>__PAGE_TITLE__</h1>

    <div class="tabs" role="tablist" aria-label="Panel">
      <button role="tab" id="tabbtn-map" aria-selected="true" aria-controls="tab-map">Map</button>
      <button role="tab" id="tabbtn-counties" aria-selected="false" aria-controls="tab-counties">Counties</button>
    </div>

    <div id="tab-map" role="tabpanel" aria-labelledby="tabbtn-map">
    <div class="seg-label" id="lbl-group">Show</div>
    <div class="seg" id="seg-group" role="group" aria-label="Member group">
      <button data-v="current" aria-pressed="true">Current</button>
      <button data-v="former" aria-pressed="false">Former</button>
      <button data-v="both" aria-pressed="false">Both</button>
    </div>
    <label class="check" id="lbl-work"><input type="checkbox" id="chk-work" checked>
      <span>Include current members placed at their workplace or school (<span id="n-work"></span>)</span></label>
    <div class="seg-label" id="lbl-geo">Group by</div>
    <div class="seg" id="seg-geo" role="group" aria-label="Geography">
      <button data-v="dots" aria-pressed="true">Dots</button>
      <button data-v="zips" aria-pressed="false">ZIP codes</button>
      <button data-v="counties" aria-pressed="false">Counties</button>
    </div>
    <div class="seg" id="seg-zoom" role="group" aria-label="Zoom">
      <button data-v="state" aria-pressed="true">Statewide</button>
      <button data-v="wasatch" aria-pressed="false">Wasatch Front</button>
    </div>

    <h2>Current members</h2>
    <div class="tiles">
      <div class="tile hl"><b id="t-total"></b><span>current members</span></div>
      <div class="tile"><b id="t-home"></b><span>placed by home ZIP</span></div>
      <div class="tile"><b id="t-work"></b><span>placed at workplace / school (no ZIP on file)</span></div>
      <div class="tile"><b id="t-none"></b><span>not on the map</span></div>
    </div>
    <p class="note" id="none-note"></p>
    <p class="note" id="former-note"></p>
    <p class="note" id="public-note" hidden></p>
    </div>

    <div id="tab-counties" role="tabpanel" aria-labelledby="tabbtn-counties" hidden>
      <div class="county-wrap">
        <div>
          <h2 class="map-title" style="margin-top:0">Current members per 10,000 residents</h2>
          <div class="county-map" id="county-map"></div>
          <div class="key" id="county-key"></div>
          <p class="note" id="county-note"></p>
          <h2 class="map-title">Expected members if spread by population</h2>
          <div class="county-map" id="exp-map"></div>
          <div class="key" id="exp-key"></div>
          <p class="note" id="exp-note"></p>
        </div>
        <table id="tbl-county">
          <thead><tr><th>County</th><th>Population</th><th>Members</th><th>Expected</th><th>Per 10k</th></tr></thead>
          <tbody></tbody><tfoot></tfoot>
        </table>
      </div>
      <div class="county-tip" id="county-tip" hidden></div>
    </div>
  </aside>
  <div class="map-wrap">
    <button class="panel-toggle" id="panel-toggle" aria-controls="panel" aria-expanded="true">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Hide panel</span></button>
    <div id="map" role="region" aria-label="Map of member locations"></div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<script>
const DATA = /*__DATA__*/null;
const fmt = n => n.toLocaleString("en-US");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state = { group: "current", geo: "dots", work: true };

// Colors picked to pop on a topo map, which is full of greens, blues, tans and red roads:
// magenta (current), strong blue (workplace), amber (former). They stay distinct for color-blind viewers.
const COL = { cur: "#9e0058", curFill: "#e6007e", work: "#0063b8", fmr: "#e69f00", fmrDark: "#8a5a00",
              outline: "#3d4146" };

// ---------- sidebar ----------
const S = DATA.stats, C = S.current;
const pct = n => `${Math.round(100 * n / C.total)}%`;
document.getElementById("n-work").textContent = fmt(C.work);
document.getElementById("t-total").textContent = fmt(C.total);
document.getElementById("t-home").textContent = `${fmt(C.home)} (${pct(C.home)})`;
document.getElementById("t-work").textContent = `${fmt(C.work)} (${pct(C.work)})`;
document.getElementById("t-none").textContent = `${fmt(C.unlocated + C.oos)} (${pct(C.unlocated + C.oos)})`;
document.getElementById("none-note").textContent =
  `Not on the map: ${fmt(C.unlocated)} with no ZIP and no locatable employer, ${fmt(C.oos)} with an out-of-state ZIP.`;
// Public build (docs/index.html): only current-member totals per ZIP code, already combined (home ZIP +
// workplace) and with counts under minCell replaced by null before they reach the page. No dots, no
// counties, no member-group, workplace or view toggles.
const PUBLIC = !!DATA.public, MIN = DATA.minCell;
const small = `fewer than ${MIN}`;
if (PUBLIC) {
  state.geo = "zips"; state.work = false;
  for (const id of ["lbl-group", "seg-group", "lbl-work", "lbl-geo", "seg-geo", "tab-counties", "former-note"])
    document.getElementById(id).remove();
  document.querySelector(".tabs").remove();
  const note = document.getElementById("public-note");
  note.hidden = false;
  note.innerHTML = `<b>Public version.</b> Shows totals by ZIP code only: no individual locations, ` +
    `and any ZIP code with 1 to ${MIN - 1} members is shown as “${small}”. Members with no ZIP on file are ` +
    `counted where they work or study.`;
} else {
  document.getElementById("former-note").innerHTML =
    `<b>Former members:</b> ${fmt(S.former.total)} total, ${fmt(S.former.home)} with a Utah ZIP (not placed by workplace). ` +
    `<b>Pending/prospective:</b> ${fmt(S.pending.total)}, none with a location.`;
}

// null = a withheld small count (public build only)
const curOf = p => p.n_current == null ? null : p.n_current + (state.work ? p.n_current_work : 0);
const val = (p, g) => g === "current" ? curOf(p) : g === "former" ? p.n_former : curOf(p) + p.n_former;

// ---------- Counties tab (internal build only): static county maps + table ----------
function initCountiesTab() {
  // Counts all current members: those placed by home ZIP plus those placed at their workplace or school.
  const COUNTY_BREAKS = [0.5, 1, 2];                    // per 10k: (0, 0.5], (0.5, 1], (1, 2], > 2
  const COUNTY_COLORS = ["#f7a8cf", "#ee5fa7", "#d1127a", "#8e0052"];
  const COUNTY_ZERO = "#e9e7e2";
  const countyColor = r => r <= 0 ? COUNTY_ZERO : COUNTY_COLORS[COUNTY_BREAKS.filter(b => r > b).length];
  // Expected members: all current members on the sheet, shared out by each county's share of Utah's
  // population. Counts, not rates, so a different (blue) color scale from the per-10k map above it.
  const EXP_BREAKS = [1, 5, 20, 50];                    // under 1, 1–5, 5–20, 20–50, 50+
  const EXP_COLORS = ["#dde8f0", "#a9c7dc", "#6c9fc3", "#3a71a0", "#174670"];
  const EXP_LABELS = ["under 1", "1–5", "5–20", "20–50", "over 50"];
  const expColor = e => EXP_COLORS[EXP_BREAKS.filter(b => e >= b).length];
  const UTAH_POP = DATA.countyTable.reduce((a, r) => a + r.pop, 0);
  const expectedOf = pop => C.total * pop / UTAH_POP;

  for (const id of ["county-map", "exp-map"]) document.getElementById(id).innerHTML = DATA.countySvg;
  document.querySelector("#county-map svg").setAttribute("aria-label", "Map of Utah counties shaded by current members per 10,000 residents");
  document.querySelector("#exp-map svg").setAttribute("aria-label", "Map of Utah counties shaded by expected members if members were spread by population");
  document.getElementById("county-key").innerHTML =
    [["0", COUNTY_ZERO], ["up to 0.5", COUNTY_COLORS[0]], ["0.5–1", COUNTY_COLORS[1]], ["1–2", COUNTY_COLORS[2]],
     ["over 2", COUNTY_COLORS[3]]].map(([t, c]) => `<span><i style="background:${c}"></i>${t}</span>`).join("") +
    `<span><i style="background:${COUNTY_COLORS[2]};opacity:.45"></i>paler: under 5 members</span>`;
  document.getElementById("exp-key").innerHTML =
    EXP_COLORS.map((c, i) => `<span><i style="background:${c}"></i>${EXP_LABELS[i]}</span>`).join("");

  const countyNow = {};    // latest numbers per county, for the hover readout
  function renderCounties() {
    const rows = DATA.countyTable.map(r => {
      const n = r.home + r.work;
      return { ...r, n, rate: n / r.pop * 1e4, exp: expectedOf(r.pop) };
    });
    for (const r of rows) {
      const el = document.querySelector(`#county-map path[data-fips="${r.fips}"]`);
      if (!el) continue;
      el.setAttribute("fill", countyColor(r.rate));
      el.setAttribute("fill-opacity", r.n > 0 && r.n < 5 ? 0.45 : 1);   // small numbers make unreliable rates
      document.querySelector(`#exp-map path[data-fips="${r.fips}"]`).setAttribute("fill", expColor(r.exp));
      countyNow[r.fips] = r;
    }
    rows.sort((a, b) => b.rate - a.rate || b.n - a.n || a.county.localeCompare(b.county));
    document.querySelector("#tbl-county tbody").innerHTML = rows.map(r =>
      `<tr data-fips="${r.fips}"><td>${esc(r.county)}</td><td>${fmt(r.pop)}</td><td>${r.n}</td>` +
      `<td>${r.exp.toFixed(1)}</td><td>${r.rate.toFixed(2)}</td></tr>`).join("");
    const tn = C.home + C.work;                          // every current member with a Utah location
    document.querySelector("#tbl-county tfoot").innerHTML =
      `<tr><td>Utah</td><td>${fmt(UTAH_POP)}</td><td>${tn}</td><td>${fmt(C.total)}</td>` +
      `<td>${(tn / UTAH_POP * 1e4).toFixed(2)}</td></tr>`;
    document.getElementById("county-note").textContent =
      `Includes ${C.work} current members with no ZIP on file who are counted where they work or study.`;
    document.getElementById("exp-note").textContent =
      `What each county would have if all ${fmt(C.total)} current members were spread across Utah in proportion ` +
      `to population: ${fmt(C.total)} × the county's share of Utah's ${fmt(UTAH_POP)} residents. ` +
      `Compare with the Members column: ${fmt(C.total - tn)} current members have no Utah location, ` +
      `so actual members add up to ${fmt(tn)}.`;
  }
  renderCounties();

  // hovering a county on either map shows its numbers instantly and highlights it on both maps and in
  // the table, and hovering a table row highlights the county on both maps
  const tip = document.getElementById("county-tip");
  for (const id of ["county-map", "exp-map"]) {
    const el = document.getElementById(id);
    el.addEventListener("pointermove", e => {
      const path = e.target.closest("path");
      if (!path) { tip.hidden = true; return; }
      const r = countyNow[path.dataset.fips];
      tip.innerHTML = tipHtml(r.county, r.n, r.pop) +
        `<br>Expected by population: ${r.exp < 1 ? r.exp.toFixed(2) : r.exp.toFixed(1)}`;
      tip.style.left = `${e.clientX + 14}px`; tip.style.top = `${e.clientY + 14}px`;
      tip.hidden = false;
    });
    el.addEventListener("pointerleave", () => { tip.hidden = true; });
  }
  const countyHL = (fips, on) => {
    document.querySelectorAll(`.county-map path[data-fips="${fips}"], #tbl-county tr[data-fips="${fips}"]`)
      .forEach(x => x.classList.toggle("hl", on));
  };
  for (const sel of ["#county-map", "#exp-map", "#tbl-county tbody"]) {
    const root = document.querySelector(sel);
    for (const [ev, on] of [["mouseover", true], ["mouseout", false]])
      root.addEventListener(ev, e => {
        const f = e.target.closest("path, tr")?.dataset.fips; if (f) countyHL(f, on);
      });
  }

  // tabs
  for (const [btn, panel] of [["tabbtn-map", "tab-map"], ["tabbtn-counties", "tab-counties"]]) {
    document.getElementById(btn).addEventListener("click", () => {
      for (const [b2, p2] of [["tabbtn-map", "tab-map"], ["tabbtn-counties", "tab-counties"]]) {
        document.getElementById(b2).setAttribute("aria-selected", b2 === btn);
        document.getElementById(p2).hidden = p2 !== panel;
      }
      document.querySelector(".app").classList.toggle("wide", panel === "tab-counties");
      const t0 = performance.now();
      (function follow() { map.resize(); if (performance.now() - t0 < 320) requestAnimationFrame(follow); })();
    });
  }
}
if (!PUBLIC) initCountiesTab();

// ---------- map ----------
// MapLibre GL draws on the GPU every frame, so dots, circles and lines resize continuously while
// zooming instead of jumping when the zoom ends.
const UTAH = [[-114.05, 36.99], [-109.04, 42.0]];
const WASATCH = [[-112.25, 40.0], [-111.55, 41.8]];
// Background: Esri World Topographic Map as vector tiles (drawn on the GPU, so text and lines stay crisp
// at every zoom and town names appear as you zoom in), plus shaded hills.
const BASEMAP_STYLE = "https://www.arcgis.com/sharing/rest/content/items/7dc6cea0b1764a1f9af2e679f642f0f5/resources/styles/root.json";

// Free elevation tiles (Mapzen Terrain Tiles on AWS Open Data) turned into shaded hills in the browser
const DEM = { type: "raster-dem", encoding: "terrarium", tileSize: 256, maxzoom: 15,
  tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
  attribution: "Elevation: Mapzen Terrain Tiles" };

async function buildStyle() {
  const style = await (await fetch(BASEMAP_STYLE)).json();
  // Esri's style points at a VectorTileServer, not a TileJSON; give MapLibre the tile URL directly
  for (const src of Object.values(style.sources)) {
    if (src.url && src.url.includes("VectorTileServer")) {
      src.tiles = [src.url.replace(/\/$/, "") + "/tile/{z}/{y}/{x}.pbf"]; delete src.url;
      src.maxzoom = 15; src.attribution = "Basemap © Esri and its data providers";
    }
  }
  // shaded hills go under roads, labels and water lines: just above the land/landcover fills
  style.sources.dem = DEM;
  const i = style.layers.findIndex(l => l.type === "line" || l.type === "symbol");
  style.layers.splice(i < 0 ? style.layers.length : i, 0, { id: "hillshade", type: "hillshade", source: "dem",
    paint: { "hillshade-exaggeration": 0.35, "hillshade-shadow-color": "#4a4033",
             "hillshade-highlight-color": "#ffffff", "hillshade-accent-color": "#4a4033",
             "hillshade-illumination-anchor": "map" } });
  return style;
}

const map = new maplibregl.Map({
  container: "map",
  bounds: UTAH, fitBoundsOptions: { padding: 20 },
  minZoom: 4.5, maxZoom: 16,
  maxBounds: [[-118.5, 35.0], [-104.5, 44.0]],      // keep Utah in view; the rest is greyed out anyway
  dragRotate: false, pitchWithRotate: false, renderWorldCopies: false,
  attributionControl: { compact: true },
  style: { version: 8, sources: {}, layers: [{ id: "bg", type: "background", paint: { "background-color": "#f7f7f5" } }] },
});
map.touchZoomRotate.disableRotation();

async function loadBasemap() {
  try {
    map.setStyle(await buildStyle(), { diff: false });
  } catch (e) {
    console.error("Background failed to load", e);   // member layers still show on the plain background
  }
}
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");

// Dots grow with zoom (~2.5 px statewide to ~9 px at street level), always with a white outline and a
// soft shadow underneath so they lift off the busy topo map
const DOT_R = ["interpolate", ["exponential", 1.4], ["zoom"], 5, 2, 7, 2.8, 9, 4, 12, 6.5, 15, 9];
const DOT_STROKE = ["interpolate", ["linear"], ["zoom"], 5, 0.8, 9, 1.2, 13, 1.6];
// shadow is the dot radius + 2 px at every zoom stop (zoom expressions cannot be nested inside "+")
const DOT_SHADOW_R = ["interpolate", ["exponential", 1.4], ["zoom"], 5, 4, 7, 4.8, 9, 6, 12, 8.5, 15, 11];

// Health-district rates (members per 10,000 residents)
// same classes and (for current members) the same colors as the Counties tab:
// 0 (gray), up to 0.5, 0.5–1, 1–2, over 2
const RATE_BREAKS = [0.5, 1, 2];
const RATE_LABELS = ["0", "up to 0.5", "0.5–1", "1–2", "over 2"];
const RAMPS = {
  current: ["#e9e7e2", "#f7a8cf", "#ee5fa7", "#d1127a", "#8e0052"],
  former:  ["#e9e7e2", "#fdd78a", "#f8b33c", "#d98a00", "#9a5c00"],
  both:    ["#e9e7e2", "#c5c2ec", "#968fdb", "#6a5fc4", "#41368f"],
};
const rateCls = r => r <= 0 ? 0 : 1 + RATE_BREAKS.filter(b => r > b).length;
// ZIP codes have no population here, so they are shaded by member count, in the same colors:
// 0 (gray), 1, 2–4, 5–9, 10+
const COUNT_BREAKS = [1, 2, 5, 10];
const COUNT_LABELS = ["0", "1", "2–4", "5–9", "10 or more"];
const countCls = n => COUNT_BREAKS.filter(b => n >= b).length;
// public build: withheld counts (null) get the "1" color and are labeled "<5"; classes are 0, 1–4, 5–9, 10+
const countColor = (ramp, n) => n == null ? ramp[1] : ramp[countCls(n)];
const showN = n => n ?? `&lt;${MIN}`;
const membersText = n => n == null ? `${small[0].toUpperCase()}${small.slice(1)} members`
                                   : `${n} member${n === 1 ? "" : "s"}`;

const dotsFC = { type: "FeatureCollection", features: DATA.dots.map(([x, y, c]) => ({
  type: "Feature", geometry: { type: "Point", coordinates: [x, y] }, properties: { cat: c } })) };
const empty = { type: "FeatureCollection", features: [] };

// per-view properties computed from the current toggles
function zipData() {
  const ramp = RAMPS[state.group];
  return { type: "FeatureCollection", features: DATA.zips.features.map(f => {
    const n = val(f.properties, state.group);
    return { ...f, properties: { ...f.properties, v: n, fillc: countColor(ramp, n), fillop: n !== 0 ? 0.8 : 0.35 } };
  }) };
}
function areaData() {
  const g = state.group, ramp = RAMPS[g];
  return { type: "FeatureCollection", features: DATA.areas.features.map(f => {
    const n = val(f.properties, g);
    return { ...f, properties: { ...f.properties, v: n, fillc: ramp[rateCls(n / f.properties.pop * 1e4)],
      fillop: n >= 5 ? 0.8 : 0.3 } };       // fade unreliable small-number rates
  }) };
}

function tipHtml(name, n, pop) {
  return `<b>${esc(name)} County</b><br>${membersText(n)}` +
         (n == null ? "" : `<br>${(n / pop * 1e4).toFixed(2)} per 10,000 residents`);
}

function zipTipHtml(p) {
  const g = state.group;
  let h = `<b>ZIP ${esc(p.ZIP5)}</b> · ${esc(p.zip_name)}<br>${membersText(p.v)}`;
  if (PUBLIC) return h;
  const parts = [];
  if (g !== "former") {
    parts.push(`${p.n_current} current by home ZIP`);
    if (state.work && p.n_current_work) parts.push(`${p.n_current_work} current at workplace / school`);
  }
  if (g !== "current") parts.push(`${p.n_former} former`);
  if (p.v && parts.length > 1) h += `<br><small>${parts.join(" · ")}</small>`;
  return h;
}

const labelOf = (f, cls) => {
  const el = document.createElement("div");
  el.className = cls;
  return { f, el, marker: new maplibregl.Marker({ element: el }).setLngLat([f.properties.lx, f.properties.ly]) };
};
const areaLabels = DATA.areas.features.map(f => labelOf(f, "area-label"));
// ZIP counts are labeled only once zoomed in; statewide they would pile up along the Wasatch Front
const ZIP_LABEL_ZOOM = 9;
const zipLabels = DATA.zips.features.map(f => labelOf(f, "area-label"));
function drawZipLabels() {
  const on = state.geo === "zips" && map.getZoom() >= ZIP_LABEL_ZOOM;
  for (const { f, el, marker } of zipLabels) {
    const n = val(f.properties, state.group);
    if (on && n !== 0) { el.innerHTML = `<b>${showN(n)}</b><br>${esc(f.properties.ZIP5)}`; marker.addTo(map); }
    else marker.remove();
  }
}
map.on("zoomend", drawZipLabels);

// Member layers are re-added whenever the background style changes. Everything except the dots sits
// under the background's labels so town names stay readable; dots go on top.
let interactionsReady = false;
function addDataLayers() {
  const before = (map.getStyle().layers.find(l => l.type === "symbol") || {}).id;
  map.addSource("areas", { type: "geojson", data: areaData() });
  map.addSource("work", { type: "geojson", data: DATA.workAreas });
  map.addSource("zipareas", { type: "geojson", data: zipData() });
  map.addSource("dots", { type: "geojson", data: dotsFC });

  // ZIP shading, also under the place-name labels, with thin ZIP boundaries
  map.addLayer({ id: "zip-fill", type: "fill", source: "zipareas",
    paint: { "fill-color": ["get", "fillc"], "fill-opacity": ["get", "fillop"] } }, before);
  map.addLayer({ id: "zip-line", type: "line", source: "zipareas",
    paint: { "line-color": "#ffffff", "line-opacity": 0.9,
             "line-width": ["interpolate", ["linear"], ["zoom"], 5, 0.3, 9, 0.8, 13, 1.5] } }, before);
  map.addLayer({ id: "zip-hover", type: "line", source: "zipareas",
    paint: { "line-color": "#1f2328", "line-width": ["case", ["boolean", ["feature-state", "hover"], false], 2.5, 0] } });

  // district shading sits under the basemap's place-name labels
  map.addLayer({ id: "area-fill", type: "fill", source: "areas",
    paint: { "fill-color": ["get", "fillc"], "fill-opacity": ["get", "fillop"] } }, before);
  map.addLayer({ id: "area-hover", type: "line", source: "areas",
    paint: { "line-color": "#1f2328", "line-width": ["case", ["boolean", ["feature-state", "hover"], false], 2.5, 0] } });
  map.addLayer({ id: "area-line", type: "line", source: "areas",
    paint: { "line-color": COL.outline, "line-dasharray": [3, 2],
             "line-width": ["interpolate", ["linear"], ["zoom"], 5, 0.8, 9, 1.4, 13, 2.5] } }, before);

  map.addLayer({ id: "work-fill", type: "fill", source: "work",
    paint: { "fill-color": COL.work, "fill-opacity": 0.05 } }, before);
  map.addLayer({ id: "work-line", type: "line", source: "work",
    paint: { "line-color": COL.work, "line-opacity": 0.7, "line-dasharray": [2, 2],
             "line-width": ["interpolate", ["linear"], ["zoom"], 8, 0.6, 13, 1.5] } }, before);

  // everything outside Utah is washed out (including other states' place names), with Utah's border on top
  map.addSource("outside", { type: "geojson", data: DATA.outsideUtah });
  map.addSource("utah-line", { type: "geojson", data: DATA.utahLine });
  map.addLayer({ id: "outside-fill", type: "fill", source: "outside",
    paint: { "fill-color": "#eeeeeb", "fill-opacity": 0.88 } });
  map.addLayer({ id: "utah-line", type: "line", source: "utah-line",
    paint: { "line-color": "#3d4146", "line-opacity": 0.8,
             "line-width": ["interpolate", ["linear"], ["zoom"], 5, 1.2, 9, 2, 13, 3] } });

  // soft shadow under every dot, then the dot itself with a white outline
  map.addLayer({ id: "dots-shadow", type: "circle", source: "dots",
    paint: { "circle-radius": DOT_SHADOW_R, "circle-color": "#000000", "circle-opacity": 0.28,
             "circle-blur": 0.6, "circle-translate": [0, 1] } });
  map.addLayer({ id: "dots", type: "circle", source: "dots",
    layout: { "circle-sort-key": ["match", ["get", "cat"], 2, 0, 1] },   // former underneath
    paint: { "circle-radius": DOT_R,
             "circle-color": ["match", ["get", "cat"], 0, COL.curFill, 1, COL.work, COL.fmr],
             "circle-opacity": 1,
             "circle-stroke-color": "#ffffff", "circle-stroke-width": DOT_STROKE } });
}

// popups and hover handlers are attached once; they follow the layer ids across background changes
function addInteractions() {
  // counties and ZIP views: hovering shows the area's numbers right away and outlines it
  const areaTip = new maplibregl.Popup({ closeButton: false, closeOnClick: false, maxWidth: "280px", offset: 12 });
  for (const [layer, source, html] of [["area-fill", "areas", p => tipHtml(p.name, p.v, p.pop)],
                                       ["zip-fill", "zipareas", zipTipHtml]]) {
    let hoverId = null;
    map.on("mousemove", layer, e => {
      const f = e.features[0];
      if (hoverId !== f.id) {
        if (hoverId !== null) map.setFeatureState({ source, id: hoverId }, { hover: false });
        hoverId = f.id; map.setFeatureState({ source, id: hoverId }, { hover: true });
      }
      map.getCanvas().style.cursor = "default";
      areaTip.setLngLat(e.lngLat).setHTML(html(f.properties)).addTo(map);
    });
    map.on("mouseleave", layer, () => {
      if (hoverId !== null) map.setFeatureState({ source, id: hoverId }, { hover: false });
      hoverId = null; areaTip.remove(); map.getCanvas().style.cursor = "";
    });
  }
  const hover = new maplibregl.Popup({ closeButton: false, closeOnClick: false, maxWidth: "300px" });
  map.on("mousemove", "work-fill", e => {
    const p = e.features[0].properties;
    map.getCanvas().style.cursor = "help";
    hover.setLngLat(e.lngLat).setHTML(`<b>${p.n} current member${p.n > 1 ? "s" : ""} placed at this workplace</b>` +
      `<br>${esc(p.orgs)}<br><small>Dots are spread around the workplace, not at homes.</small>`).addTo(map);
  });
  map.on("mouseleave", "work-fill", () => { hover.remove(); map.getCanvas().style.cursor = ""; });
}

map.on("style.load", () => {
  if (!map.getSource("dots")) addDataLayers();
  if (!interactionsReady) { addInteractions(); applyHash(); interactionsReady = true; }
  draw();
});
loadBasemap();


const vis = (id, on) => map.setLayoutProperty(id, "visibility", on ? "visible" : "none");

function draw() {
  const g = state.group, geo = state.geo;
  if (geo === "zips") map.getSource("zipareas").setData(zipData());
  if (geo === "counties") map.getSource("areas").setData(areaData());

  // ZIP codes
  for (const id of ["zip-fill", "zip-line", "zip-hover"]) vis(id, geo === "zips");
  drawZipLabels();

  // dots
  vis("dots", geo === "dots"); vis("dots-shadow", geo === "dots");
  const cats = [];
  if (g !== "current") cats.push(2);
  if (g !== "former") { cats.push(0); if (state.work) cats.push(1); }
  map.setFilter("dots", ["in", ["get", "cat"], ["literal", cats]]);
  map.setFilter("dots-shadow", ["in", ["get", "cat"], ["literal", cats]]);
  vis("work-fill", geo === "dots" && g !== "former" && state.work);
  vis("work-line", geo === "dots" && g !== "former" && state.work);

  // counties (the background's own place names are hidden there; county labels carry the names)
  vis("area-fill", geo === "counties"); vis("area-hover", geo === "counties");
  for (const l of map.getStyle().layers)
    if (l.type === "symbol") vis(l.id, geo !== "counties");
  for (const { f, el, marker } of areaLabels) {
    if (geo === "counties") { el.innerHTML = `<b>${showN(val(f.properties, g))}</b><br>${esc(f.properties.name)}`; marker.addTo(map); }
    else marker.remove();
  }

  updateLegend();
}

function updateLegend() {
  const g = state.group, el = document.getElementById("legend");
  const name = { current: "Current", former: "Former", both: "All" }[g];
  if (state.geo === "counties") {
    el.innerHTML = `<b>${name} members per 10,000 residents</b><br>` + RAMPS[g]
      .map((c, i) => `<i style="background:${c}"></i>${RATE_LABELS[i]}`).join("<br>") +
      `<small>Faded: fewer than 5 members, so the rate is unreliable. Labels show member counts.</small>`;
    return;
  }
  if (state.geo === "dots") {
    const n = [0, 0, 0];
    for (const d of DATA.dots) n[d[2]]++;
    const rows = [];
    if (g !== "former") {
      rows.push(`<span class="swatch" style="background:${COL.curFill}"></span>Current, home ZIP (${n[0]})`);
      if (state.work) rows.push(`<span class="swatch" style="background:${COL.work}"></span>Current, at workplace (${n[1]})`);
    }
    if (g !== "current") rows.push(`<span class="swatch" style="background:${COL.fmr}"></span>Former (${n[2]})`);
    el.innerHTML = `<b>1 dot = 1 member</b><br>${rows.join("<br>")}` +
      `<small>Dots are scattered at random within each member's ZIP code (town areas where possible, never ` +
      `on lakes), or around the workplace (dashed areas; hover for the organizations). They are not homes.</small>`;
    return;
  }
  // ZIP codes, shaded by member count
  if (PUBLIC) {
    const off = DATA.noZipArea.current;
    el.innerHTML = `<b>Current members by ZIP code</b><br>` +
      [[0, "0"], [1, `1–${MIN - 1} (number withheld)`], [3, "5–9"], [4, "10 or more"]]
        .map(([i, t]) => `<i style="background:${RAMPS.current[i]}"></i>${t}`).join("<br>") +
      `<small>Hover a ZIP for its numbers; counts are labeled when you zoom in. Includes members counted ` +
      `at their workplace or school.` +
      (off === 0 ? "" : ` ${off == null ? `A few (${small})` : off} members have a PO-box ZIP with no ` +
                         `boundary and are not shown.`) + `</small>`;
    return;
  }
  const off = DATA.noZipArea, nOff = (g !== "former" ? off.current || 0 : 0) + (g !== "current" ? off.former || 0 : 0);
  el.innerHTML = `<b>${name} members by ZIP code</b><br>` + RAMPS[g]
    .map((c, i) => `<i style="background:${c}"></i>${COUNT_LABELS[i]}`).join("<br>") +
    `<small>Hover a ZIP for its numbers; counts are labeled when you zoom in.` +
    (g !== "former" && state.work ? " Includes members counted at their workplace or school." : "") +
    (nOff ? ` ${nOff} member${nOff === 1 ? " has" : "s have"} a PO-box ZIP with no boundary and ${nOff === 1 ? "is" : "are"} not shown.` : "") +
    `</small>`;
}

// ---------- controls ----------
function press(el, b) { el.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); }
function wireSeg(id, fn) {
  const el = document.getElementById(id);
  if (!el) return;                                     // public build removes some controls
  el.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    press(el, b); fn(b.dataset.v);
  });
}
wireSeg("seg-group", v => { state.group = v; draw(); });
wireSeg("seg-geo", v => { state.geo = v; draw(); });
wireSeg("seg-zoom", v => map.fitBounds(v === "wasatch" ? WASATCH : UTAH, { padding: 20, duration: 900 }));
document.getElementById("chk-work")?.addEventListener("change", e => { state.work = e.target.checked; draw(); });

// ---------- hide / show the data panel ----------
const app = document.querySelector(".app"), toggleBtn = document.getElementById("panel-toggle");
function setPanel(open, remember = true) {
  app.classList.toggle("collapsed", !open);
  toggleBtn.setAttribute("aria-expanded", open);
  toggleBtn.querySelector("span").textContent = open ? "Hide panel" : "Show data panel";
  // keep the map filling its area while the panel slides
  const t0 = performance.now();
  (function follow() { map.resize(); if (performance.now() - t0 < 320) requestAnimationFrame(follow); })();
  if (remember) try { localStorage.setItem("member-map-panel", open ? "open" : "closed"); } catch (e) {}
}
toggleBtn.addEventListener("click", () => setPanel(app.classList.contains("collapsed")));
try { if (localStorage.getItem("member-map-panel") === "closed") setPanel(false, false); } catch (e) {}

// editing the view after # in the address bar reloads the page with that view
window.addEventListener("hashchange", () => location.reload());

// optional starting view from the URL, e.g. member_map.html#both,zips,wasatch,nowork
// or #dots,at:41.74:-111.81:12 (lat:lon:zoom)
function applyHash() {
  for (const v of location.hash.slice(1).split(",").filter(Boolean)) {
    if (v === "nowork") {
      state.work = false;
      const chk = document.getElementById("chk-work"); if (chk) chk.checked = false;
      continue;
    }
    if (v === "nopanel") { setPanel(false, false); continue; }
    if (v.startsWith("at:")) {
      const [, lat, lon, z] = v.split(":").map(Number);
      map.jumpTo({ center: [lon, lat], zoom: z || 11 }); continue;
    }
    const b = document.querySelector(`.seg button[data-v="${CSS.escape(v)}"]`);
    if (!b) continue;
    press(b.parentElement, b);
    if (b.parentElement.id === "seg-group") state.group = v;
    if (b.parentElement.id === "seg-geo") state.geo = v;
    if (v === "wasatch") map.fitBounds(WASATCH, { padding: 20, duration: 0 });
  }
}
</script>
</body>
</html>
